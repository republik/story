      <h1>Who Takes The Cake</h1>
      <republik-who-takes-the-cake data='{"info":{"title":"Gesamtbudget","tableCaption":"Alle Zahlen ohne Einheit in Tausend CHF","caption":"Konsolidiertes Ausgabenbudget der Republik AG und der Project R Genossenschaft für das 3. Geschäftsjahr vom 1.&amp;nbsp;Juli 2019 bis zum 30.&amp;nbsp;Juni 2020.&lt;br/&gt;&lt;br/&gt;Daten-Download: &lt;a href=&apos;https://cdn.republik.space/s3/republik-assets/assets/genossenschaft/Gesamtbudget_Republik_2019_2020.csv&apos; download&gt;CSV&lt;/a&gt; &amp;middot; &lt;a href=&apos;https://cdn.republik.space/s3/republik-assets/assets/genossenschaft/Gesamtbudget_Republik_2019_2020.xlsx&apos; download&gt;Excel&lt;/a&gt;"},"data":[{"category":"Redaktion","label":"Journalistinnen","pk":1788662,"sk":365000,"more":"Die Löhne unserer Redaktorinnen, Reporter und Auszubildenden machen den grössten Teil der Personalkosten (PK) aus. Die Sachkosten (SK) bei den Journalistinnen sind Ausgaben für freie Autoren. Mit den Ausgaben für Bild und Multimedia werden unsere festen Mitarbeiterinnen wie auch Fotografen, Illustratorinnen und Bildagenturen bezahlt. Die Produktion sorgt für den reibungslosen Produktionsablauf. Sie redigiert, korrigiert, schreibt Titel und Leads und checkt die Fakten. Zusammen sind dies rund 57% des Gesamtbudgets."},{"category":"Redaktion","label":"Ausbildung","pk":1088,"sk":480},{"category":"Redaktion","label":"Rechercheetat","pk":0,"sk":12000},{"category":"Redaktion","label":"Bild","pk":174857,"sk":24680},{"category":"Redaktion","label":"Multimedia","pk":74291,"sk":8240},{"category":"Redaktion","label":"Produktion","pk":382682,"sk":7760},{"category":"IT und Design","label":"IT","pk":533903,"sk":185400,"more":"Unsere IT-Mitarbeiterinnen entwickeln mit der Redaktion interaktive Geschichten und Datenvisualisierungen. Sie verbessern Website, App, CMS und interne Tools zum Beispiel für die Aboverwaltung, das Marketing und die Finanzen. Zudem stellen sie sicher, dass die Republik rund um die Uhr online ist und Bugs behoben werden. Ihre Löhne sind in den Personalkosten (PK) aufgeführt. In den Sachkosten (SK) sind Ausgaben für freie Mitarbeiter, Designagenturen, Software und Hosting enthalten. Dies ergibt rund 14% des Gesamtbudgets."},{"category":"IT und Design","label":"Design","pk":96000,"sk":4000},{"category":"Community","label":"Community","pk":422699,"sk":394000,"more":"Dieses Team pflegt und erweitert unsere Community, Sie als Verleger und Ihre zukünftigen Kolleginnen: im Dialog, mit Veranstaltungen, Werbung, Kampagnen, Erster Hilfe bei technischen Problemen und anderen Anliegen, Merchandise, Unternehmenskommunikation. Die Löhne dieser Mitarbeiter sind in den Personalkosten (PK) zusammengefasst. Ausgaben für Saalmieten, Honorare, Werbung, Versand etc. sind in den Sachkosten (SK) enthalten. Insgesamt fliessen rund 14% des Gesamtbudgets in diesen Bereich."},{"category":"Unternehmensführung","label":"Geschäftsleitung","pk":146800,"sk":190300,"more":"Die Ausgaben für die Unternehmensführung machen rund 8% des Gesamtbudgets aus. Die Personalkosten (PK) der Geschäftsleitung sind die Löhne unserer Geschäftsführerinnen. In den Sachkosten (SK) der Geschäftsleitung sind Ausgaben für die Revisionsstelle, Rechtsberatungen, Personalanlässe, Weiterbildungen und eine Reserve für Notfälle enthalten. Die Ausgaben für Vorstand (VS) und Verwaltungsrat (VR) sind Löhne sowie Mandatsleistungen für Personen, die in diesen Gremien arbeiten. Auch die Kosten für den Genossenschaftsrat sind hier hinzugerechnet."},{"category":"Unternehmensführung","label":"VR/VS","pk":34300,"sk":8800},{"category":"Zentrale Dienste","label":"Zentrale Dienste","pk":177692,"sk":248600,"more":"Die Personalkosten (PK) der zentralen Dienste sind Löhne für Human Resources, Finanzen, Infrastruktur und Projekte wie zum Beispiel diese Abstimmung und Darstellung des Gesamtbudgets. Die Miete des Rothauses und die Ausgaben für Reinigung, Büromaterial, Versicherungen und die Finanzbuchhaltung sind in den Sachkosten (SK) enthalten. Unter den zentralen Diensten werden damit 7% des Gesamtbudgets zusammengefasst."}]}'></republik-who-takes-the-cake>
