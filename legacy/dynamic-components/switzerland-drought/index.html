      <republik-switzerland-drought data='{"anchor":"plot","title":"Dürre in der Schweiz","lead":"Wie kam es dazu?","phases":[{"title":"Trockenheit im Winter","step":"step1"},{"title":"Hitze im Mai","step":"step2"},{"title":"Trockenheit in den Sommermonaten","step":"step3"},{"title":"Hitze und Trockenheit im Jahr 2022","step":"step4"}],"translations":[{"key":"step1/text","value":"Es war irre trocken und zwar schon früh. Im Tessin fehlte der Niederschlag. Die Berge blieben kahl. {municipality_winter}"},{"key":"step1/municipality_winter","value":"In {municipality} gab es {winter_diff} weniger Niederschlag als in der Normperiode von 1991 bis 2020."},{"key":"step2/text","value":"Während der ersten Coronawelle geht die Nachfrage nach Energie stark zurück. So sinken die Preise für {CP045} (-6,3 Prozent) und fürs {CP072} {8.9}. Das dämpft auch die Gesamtinflation: Sie ist im Mai 2020 praktisch inexistent (+0,1 Prozent)."},{"key":"step2/CP045","value":"Strom und Gas"},{"key":"step2/CP072","value":"Autofahren"},{"key":"step3/text","value":"Ein Jahr später stehen die Vorzeichen umgekehrt. Die {CP045} (+7,7 Prozent) und die Kosten des {CP072} (+11 Prozent) nehmen wieder zu. Anders läuft es in der {CP112}, wo die Preise fallen {3.2}. Unter dem Strich liegt die Inflation im Mai 2021 aber genau am geldpolitisch gewünschten Ziel {2}."},{"key":"step3/CP045","value":"Strom- und Gaspreise"},{"key":"step3/CP072","value":"Autofahrens"},{"key":"step3/CP112","value":"Hotellerie"},{"key":"step4/text","value":"Das ist im Mai 2022 nicht mehr der Fall. {CP045} (+44 Prozent), {CP072} (+19 Prozent), {CP011} (+8,9 Prozent): Zahlreiche Waren, die energieintensiv sind oder aus Asien importiert werden müssen, sind nun deutlich teurer als ein Jahr zuvor. Und auch in der {CP112} steigen nach der Aufhebung mancher Reiserestriktionen wieder die Preise (+14 Prozent). Die Gesamtinflation schnellt hoch {8.1}. Aber nicht alles wird teurer: Beispielsweise sind {CP041} {1.5} und {CP082_083} {0.6} kaum von I
