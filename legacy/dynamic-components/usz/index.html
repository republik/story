      <h1>Usz</h1>
      <republik-usz data='{"corrective":"In einer früheren Version war das Publikationsdatum des «Tages-Anzeiger»-Artikels «Wie der Klinikchef die Weltpremiere seines Implantats schönte» falsch angegeben. Das haben wir korrigiert.","cast":[{"name":"Francesco Maisano","img":"Maisano.jpg","bio":"Herzchirurg, Direktor Klinik für Herzchirurgie Universitätsspital Zürich (USZ) von 2014 bis 2021, am USZ seit 2013 angestellt"},{"name":"Whistleblower","img":"Whistleblower.jpg","bio":"Herzchirurg, bis 2021 leitender Arzt Klinik für Herzchirurgie am USZ"},{"name":"Frank Ruschitzka","img":"Ruschitzka.jpg","bio":"Kardiologe, Direktor Klinik für Kardiologie USZ seit 2018, Leiter Universitäres Herz­&amp;shy;zentrum Zürich, am USZ seit 1997 angestellt"},{"name":"Michele Genoni","img":"Genoni.jpg","bio":"Herzchirurg, bis 2018 Stellvertreter von Maisano, Ex-Klinik&amp;shy;­direktor Herzchirurgie am Stadtspital Triemli, Präsident des Chirurgen-Dachverbands FMCH, ärztlicher Direktor Rehaklinik Seewis"},{"name":"Gregor Zünd","img":"Zuend.jpg","bio":"Herzchirurg, Direktor USZ seit 2016, zuvor Direktor Forschung und Lehre, am USZ seit 1997 angestellt"},{"name":"Martin Waser","img":"Waser.jpg","bio":"Präsident Spitalrat USZ von 2014 bis 2021, zuvor Zürcher Stadtrat"},{"name":"Thomas Lüscher","img":"Luescher.jpg","bio":"Kardiologe, 1996 bis 2017 Direktor Klinik für Kardiologie USZ, seither in London an den Royal Brompton&amp;nbsp;and Harefield Hospitals, Chefredaktor «European Heart Journal»"},{"name":"Peter Matt","img":"Matt.jpg","bio":"Herzchirurg, 2020 kurzzeitig stv. Direktor Klinik für Herzchirurgie USZ, seit 2021 Chefarzt Herzchirurgie Kantons­spital Luzern und Präsident der Schweizerischen Gesellschaft für Herzchirurgie"},{"name":"Natalie Rickli","img":"Rickli.jpg","bio":"Regierungs&amp;shy;­rätin Kanton Zürich, Vorsteherin des Gesundheits­&amp;shy;departements"},{"name":"Volkmar Falk","img":"Falk.jpg","bio":"Herzchirurg, Vorgänger von Maisano, bis 2014 Direktor Klinik für Herzchirurgie USZ, seither an der Berliner Charité"},{"name":"Clemenz Jost","img":"Jost.jpg","bio":"Aargauer Unternehmer im Ruhestand und ehemaliger Einwohnerrat, Patient von Maisano"}],"timeline":[{"title":"01.10.2014","date":"1. Oktober 2014","content":"&lt;p&gt;Der Mailänder Chirurg Francesco Maisano beginnt als neuer Direktor für Herz­chirurgie am Universitätsspital Zürich (USZ) sowie als Ordinarius für Herz­chirurgie an der Universität Zürich (UZH). Er ersetzt Volkmar Falk, der nach Berlin wechselt. Maisano verkörpere «international die neue Ära der modernen Herz­&amp;shy;chirurgie», heisst es in einer &lt;a href=&apos;http://www.usz.ch/news/medienmitteilungen/seiten/maisano_neuer_direktor.aspx&apos;&gt;Medienmitteilung des USZ&lt;/a&gt;, die auch seine Innovationskraft und 14 Patente hervorhebt.&lt;/p&gt;"},{"title":"24.03.2015","date":"24. März 2015","content":"&lt;p&gt;Die Kliniken für Herz­&amp;shy;chirurgie des Unispitals und des Stadt­spitals Triemli bilden eine «Allianz Herz­&amp;shy;chirurgie Zürich». Sie bleiben zwar eigenständig, wollen ihre herz­chirurgischen Angebote jedoch koordinieren, &lt;a href=&apos;https://www.stadt-zuerich.ch/gud/de/index/departement/medien/medienmitteilungen/2015/maerz/150324a.html&apos;&gt;um Behandlungsqualität und Effizienz zu steigern&lt;/a&gt;. Geleitet wird die Allianz von Francesco Maisano und Michele Genoni, dem Chef der Herz­­&amp;shy;chirurgie am Triemli. Genoni wird zudem Stellvertreter Maisanos am USZ.&lt;/p&gt;"},{"title":"26.09.2016","date":"26. September 2016","content":"&lt;p&gt;«Weltpremiere: Herzteam des Universitäts­&amp;shy;spitals Zürich führt erstmals neuen Eingriff an einer Herz&amp;shy;­klappe durch», heisst es in einer &lt;a href=&apos;http://www.usz.ch/news/medienmitteilungen/Seiten/Neuer-Eingriff-an-Herzklappe.aspx&apos;&gt;Medienmitteilung&lt;/a&gt; des USZ. Einem von Maisano geleiteten Team von Herz­chirurgen und Kardiologen sei es gelungen, eine undichte Trikuspidal­&amp;shy;klappe mittels einer neuen Katheter­&amp;shy;technik zu reparieren. Ein historischer Durch&amp;shy;­bruch: Mit dieser minimal­&amp;shy;invasiven Methode könnten Patienten behandelt werden, die wegen ihres Alters oder anderer Risiko­&amp;shy;faktoren bisher als inoperabel galten.&lt;/p&gt;"},{"title":"01.01.2018","date":"1. Januar 2018","content":"&lt;p&gt;Frank Ruschitzka &lt;a href=&apos;http://www.usz.ch/news/Seiten/Frank-Ruschitzka-wird-neuer-Direktor-der-Klinik-fuer-Kardiologie-.aspx&apos;&gt;beginnt als neuer Direktor für Kardiologie am USZ&lt;/a&gt; sowie als Ordinarius für Kardiologie an der UZH. Er ersetzt Thomas Lüscher, der altershalber in Zürich aufhört und nach London wechselt.&lt;/p&gt;"},{"title":"01.09.2018","date":"1. September 2018","content":"&lt;p&gt;Michele Genoni, bis dahin in einem 20-Prozent-Pensum als Stellvertreter Maisanos tätig und nebenher Klinik­&amp;shy;direktor am Stadt­&amp;shy;spital Triemli, wechselt ganz ans USZ. Er bleibt die rechte Hand Maisanos und soll vor allem für administrative und organisatorische Aufgaben sowie fürs Qualitäts­&amp;shy;management verantwortlich sein.&lt;/p&gt;"},{"title":"11.04.2019","date":"11. April 2019","content":"&lt;p&gt;Die Klinik für Herz&amp;shy;chirurgie wird verkleinert, weil das Unispital &lt;a href=&apos;https://www.usz.ch/news/Seiten/Neue-Klinik-Gefasschirurgie.aspx&apos;&gt;eine eigenständige Klinik für Gefässchirurgie schafft&lt;/a&gt;.&lt;/p&gt;"},{"title":"01.07.2019","date":"1. Juli 2019","content":"&lt;p&gt;Michele Genoni verlässt das USZ bereits wieder und wird ärztlicher Direktor der Reha&amp;shy;­klinik im bündnerischen Seewis. In der &lt;a href=&apos;https://www.usz.ch/news/Mitteilungen/Seiten/michele-genoni.aspx&apos;&gt;Medienmitteilung&lt;/a&gt; dankt ihm die USZ-Leitung dafür, die Zusammen­arbeit mit dem Stadt&amp;shy;­spital Triemli «mit grossem Erfolg weiter­&amp;shy;entwickelt» und institutionalisiert zu haben. Das ist allerdings nur die halbe Wahrheit: Tatsächlich konkurrenzieren sich die Herz­&amp;shy;abteilungen der beiden Kranken­&amp;shy;häuser nach wie vor. Und über den Grund für die Trennung von Genoni schweigt sich das USZ aus.&lt;/p&gt;"},{"title":"Mitte Juli 2019","date":"Mitte Juli 2019","content":"&lt;p&gt;An einer Leitungs­&amp;shy;sitzung erhebt Frank Ruschitzka Vorwürfe gegen Francesco Maisano. Es handelt sich im Wesentlichen um dieselben Vorwürfe, die einige Monate später ein Whistle&amp;shy;­blower vorbringt. Maisano verlangt ein Audit. Zwei externe Gutachter untersuchen, ob die Prozesse, Anforderungen und Richt­&amp;shy;linien der Herz­&amp;shy;chirurgie die geforderten Standards erfüllen.&lt;/p&gt;"},{"title":"29.10.2019","date":"29. Oktober 2019","content":"&lt;p&gt;Das Audit entlastet den Direktor für Herz&amp;shy;­chirurgie weitgehend: Organisation und Qualitäts&amp;shy;­management seiner Forschung seien regel&amp;shy;­konform, bei seinen Kontakten zur Industrie seien keine Unregelmässigkeiten festgestellt worden. Die Gutachter&amp;nbsp; – zwei Herz&amp;shy;­chirurgen –&amp;nbsp; empfehlen vereinzelte Verbesserungen bei der Transparenz.&lt;/p&gt;"},{"title":"19.12.2019","date":"12. Dezember 2019","content":"&lt;p&gt;Ein leitender Arzt der Herzchirurgie hat der Spital­&amp;shy;­leitung bereits Anfang Dezember ein zweiseitiges «Whistleblowing»-Dokument übergeben, das eine Zusammen&amp;shy;­­fassung seiner Vorwürfe gegen Maisano enthält. Einige Tage später reicht er ein insgesamt 43-seitiges Dokument nach.&lt;/p&gt;"},{"title":"Dezember 2019","date":"Dezember 2019","content":"&lt;p&gt;In Ergänzung des Audits vom 29.&amp;nbsp; Oktober 2019 beauftragt das USZ die Zürcher Anwaltskanzlei Walder Wyss, die vom Whistle&amp;shy;­­­blower gegen Francesco Maisano erhobenen Vorwürfe zu untersuchen.&lt;/p&gt;"},{"title":"20.01.2020","date":"20. Januar 2020","content":"&lt;p&gt;Die Spitalleitung schlägt dem Whistle&amp;shy;­­­blower vor, er möge ab dem 1.&amp;nbsp; Februar eine dreimonatige bezahlte Auszeit nehmen. Er lehnt ab.&lt;/p&gt;"},{"title":"07.04.2020","date":"7. April 2020","content":"&lt;p&gt;Die Spitaldirektion spricht «aufgrund sehr besorgnis­erregender Informationen aus der Ärzteschaft» ein befristetes Operations­verbot gegen den Whistle­blower aus. Er soll für «schwere Komplikationen» bei mehreren Patienten verantwortlich sein.&lt;/p&gt;"},{"title":"21.04.2020","date":"21. April 2020","content":"&lt;p&gt;Das USZ erhält den Zwischen&amp;shy;­­bericht von der Anwalts­&amp;shy;­kanzlei Walder Wyss. Kurz darauf verfasst Francesco Maisano eine erste Stellung­&amp;shy;­nahme, die vom Rechts­&amp;shy;­dienst des USZ aber zurück­&amp;shy;­gewiesen wird, weil sie zu lang sei.&lt;/p&gt;"},{"title":"27.04.2020","date":"21. April 2020","content":"&lt;p&gt;Der Whistleblower erhält eine erste Kündigung&amp;nbsp; – wegen Zerrüttung.&lt;/p&gt;"},{"title":"21.05.2020","date":"21. April 2020","content":"&lt;p&gt;Der «Tages-Anzeiger» publiziert den Artikel, der die Auseinander&amp;shy;­setzung am USZ erstmals öffentlich macht: &lt;a href=&apos;https://www.tagesanzeiger.ch/wie-der-klinikchef-die-weltpremiere-seines-implantats-schoente-376586369291&apos;&gt;«Wie der Klinikchef die Weltpremiere seines Implantats schönte.»&lt;/a&gt;&lt;/p&gt;"},{"title":"22.05.2020","date":"22. Mai 2020","content":"&lt;p&gt;Das USZ macht den Zwischen­&amp;shy;bericht von Walder Wyss der Öffentlichkeit zugänglich. In der zugehörigen &lt;a href=&apos;http://www.usz.ch/news/medienmitteilungen/Seiten/Audit-Herzchirurgie.aspx&apos;&gt;Medienmitteilung&lt;/a&gt; schreibt die Spital­&amp;shy;leitung, die Klinik für Herz&amp;shy;­chirurgie weise «im Bereich der Patienten&amp;shy;­dokumentation, der Transparenz und der wissenschaftlichen Publizistik» Mängel auf. Hingegen habe Walder Wyss keine Gefährdung des Patienten­&amp;shy;wohls und keine Hinweise auf ein strafbares Verhalten festgestellt. In einer &lt;a href=&apos;https://www.nzz.ch/zuerich/geschoente-studien-und-unterschlagene-interessenkonflikte-herzchirurg-des-zuercher-universitaetsspitals-unter-druck-ld.1557758&apos;&gt;Stellungnahme zuhanden der NZZ&lt;/a&gt; schreibt das USZ: «Die Spital&amp;shy;­leitung steht hinter Prof.&amp;nbsp; Maisano und der Klinik für Herz&amp;shy;­chirurgie und unterstützt diese in der Umsetzung der beschlossenen Massnahmen.»&lt;/p&gt;"},{"title":"22.05.2020","date":"22. Mai 2020","content":"&lt;p&gt;Das USZ berichtet mit einer &lt;a href=&apos;http://www.usz.ch/news/medienmitteilungen/Seiten/mm-covid-19-hydroxychloroquin.aspx&apos;&gt;Medienmitteilung&lt;/a&gt; über eine weltweite Beobachtungs­studie mit 96’000 hospitalisierten Covid-19-Patienten, an der Frank Ruschitzka als einer von 4&amp;nbsp; Autoren beteiligt war. Die in der renommierten Fachzeitschrift «The Lancet» veröffentlichte Studie habe gezeigt, dass mit Hydroxy&amp;shy;­chloroquin oder Chloroquin behandelte Patienten ein erhöhtes Risiko für Herzrhythmus­&amp;shy;störungen und eine höhere Sterblichkeits&amp;shy;­rate aufwiesen.&lt;/p&gt;"},{"title":"26.05.2020","date":"26. Mai 2020","content":"&lt;p&gt;Die Universität Zürich &lt;a href=&apos;https://www.nzz.ch/zuerich/herzchirurg-maisano-universitaet-zuerich-prueft-sanktionen-ld.1558088&apos;&gt;kündigt eine Untersuchung gegen Francesco Maisano an&lt;/a&gt;. Der Verdacht: wissenschaftliche Unlauterkeit.&lt;/p&gt;"},{"title":"27.05.2020","date":"27. Mai 2020","content":"&lt;p&gt;Der Spitalrat beurlaubt Maisano &lt;a href=&apos;http://www.usz.ch/news/medienmitteilungen/Seiten/mm-massnahmen-spitalrat.aspx&apos;&gt;«aufgrund der belastenden Ausnahmesituation»&lt;/a&gt; für vorerst drei Wochen.&lt;/p&gt;"},{"title":"28.05.2020","date":"28. Mai 2020","content":"&lt;p&gt;Die Aufsichtskommission für Bildung und Gesundheit des Zürcher Kantonsrats &lt;a href=&apos;https://parlzhcdws.cmicloud.ch/parlzh5/cdws/Files/2c57db8da12e42899fd81ebda578fc51-332/1/pdf&apos;&gt;setzt eine Subkommission ein&lt;/a&gt;, um die Vorkommnisse in der Herzchirurgie des USZ umfassend zu untersuchen.&lt;/p&gt;"},{"title":"05.06.2020","date":"5. Juni 2020","content":"&lt;p&gt;Das USZ informiert, dass Frank Ruschitzka und seine Co-Autoren ihre in «The Lancet» veröffentlichte Studie zurück&amp;shy;­gezogen haben, da sie auf einem gefälschten Datensatz basiere. In der &lt;a href=&apos;http://www.usz.ch/news/medienmitteilungen/Seiten/mm-covid-19-hydroxychloroquin.aspx&apos;&gt;Medienmitteilung&lt;/a&gt; wird betont, dass weder die Klinik für Kardiologie noch ihr Leiter an der Bereit&amp;shy;­stellung der Daten beteiligt gewesen sei.&lt;/p&gt;"},{"title":"09.06.2020","date":"9. Juni 2020","content":"&lt;p&gt;Das USZ gibt bekannt, &lt;a href=&apos;http://www.usz.ch/news/medienmitteilungen/Seiten/mm-herzchirurgie.aspx&apos;&gt;Maisano&lt;/a&gt; bleibe bis zum Abschluss der laufenden universitären Unter­&amp;shy;suchung beurlaubt.&lt;/p&gt;"},{"title":"11.06.2020","date":"11. Juni 2020","content":"&lt;p&gt;Auf Drängen von Gesundheits­&amp;shy;direktorin Natalie Rickli beauftragt das USZ die Anwalts­&amp;shy;kanzlei Walder Wyss mit einer ergänzenden Unter­&amp;shy;suchung der Vorkommnisse in der Herzchirurgie. Insbesondere soll die Korrespondenz zwischen Maisano und Swissmedic ausgewertet werden, der schweizerischen Zulassungs- und Aufsichts&amp;shy;­behörde für Arznei­&amp;shy;mittel und Medizinprodukte.&lt;/p&gt;"},{"title":"18.06.2020","date":"18. Juni 2020","content":"&lt;p&gt;Paul Vogt wird per Anfang Juli &lt;a href=&apos;http://www.usz.ch/news/medienmitteilungen/Seiten/Verstaerkung-Leitung-Herzchirurgie.aspx&apos;&gt;als interimistischer Leiter der USZ-Herzchirurgie eingesetzt&lt;/a&gt;.&lt;/p&gt;"},{"title":"29.06.2020","date":"29. Juni 2020","content":"&lt;p&gt;Maisano übergibt dem USZ seine Stellung­&amp;shy;nahme zum Zwischen&amp;shy;­bericht von Walder Wyss, die er mit der Anwalts­&amp;shy;kanzlei Niederer Kraft Frey verfasst hat. Er bittet Spital­&amp;shy;direktor Gregor Zünd, das USZ möge seine Stellungnahme veröffentlichen, was Spitalrats­&amp;shy;präsident Martin Waser ablehnt. Auch zu einem Gespräch zeigt sich Waser nicht bereit. Kurz darauf &lt;a href=&apos;https://res.cloudinary.com/deep-impact-ag/image/upload/v1594284474/medinside/Stellungnahme_Francesco_Maisano_zum_Bericht_Walder_Wyss_bujgb3.pdf&apos;&gt;veröffentlicht Maisano seine Stellungnahme selbst&lt;/a&gt; auf &lt;a href=&apos;https://www.linkedin.com/posts/francesco-maisano-b838b5b_nzzarticle-on-prejudice-against-maisano-activity-6688466737119166464-koTB&apos;&gt;Linkedin&lt;/a&gt;.&lt;/p&gt;"},{"title":"08.07.2020","date":"8. Juli 2020","content":"&lt;p&gt;Der Whistleblower kehrt ans USZ zurück. Warum die Spital­&amp;shy;leitung den gekündigten leitenden Arzt wieder einstellt, bleibt unklar.&lt;/p&gt;"},{"title":"10.07.2020","date":"10. Juli 2020","content":"&lt;p&gt;Erstmals äussert sich Francesco Maisano öffentlich. &lt;a href=&apos;https://www.nzz.ch/zuerich/universitaetsspital-zuerich-herzchirurg-maisano-wehrt-sich-ld.1565297&apos;&gt;Im Interview mit der NZZ&lt;/a&gt; sagt er, der Whistle&amp;shy;blower verbreite «nachweislich fakten­&amp;shy;widrige und verleumderische Geschichten». Nie in seinem Leben hätten ihn finanzielle Interessen angetrieben, nie habe er etwas verheimlichen wollen. «Ich wollte etwas Neues entwickeln, um Patienten zu helfen.»&lt;/p&gt;"},{"title":"Mitte Juli 2020","date":"Mitte Juli 2020","content":"&lt;p&gt;Das Kantonsspital St.&amp;nbsp; Gallen und Anästhesisten am USZ teilen der Spital­&amp;shy;leitung ihre Bedenken zur Wieder­beschäftigung des Whistle­&amp;shy;blowers mit. Sie sehen die Patienten­&amp;shy;sicherheit gefährdet.&lt;/p&gt;"},{"title":"16.07.2020","date":"16. Juli 2020","content":"&lt;p&gt;Das Lauterkeitsverfahren der Universität Zürich gegen Frank Ruschitzka &lt;a href=&apos;https://www.nzz.ch/wissenschaft/ruschitzka-universitaet-stellt-verfahren-wegen-lancet-studie-ein-ld.1566783&apos;&gt;endet mit einer Ermahnung&lt;/a&gt;: Der Leiter der Kardiologie wird angehalten, bei wissenschaftlichen Publikationen sorgfältiger zu verfahren und sämtliche Aspekte rigoros auf ihre wissenschaftliche Integrität zu prüfen. Ruschitzka kommt mit einer milden Sanktion davon.&lt;/p&gt;"},{"title":"27.07.2020","date":"27. Juli 2020","content":"&lt;p&gt;Der Spitalrat suspendiert Maisano auf unbestimmte Zeit. Am 4.&amp;nbsp; August reicht er &lt;a href=&apos;https://www.tagesanzeiger.ch/unispital-reicht-strafanzeige-gegen-francesco-maisano-ein-411749908937&apos;&gt;Strafanzeige wegen Verdachts auf Urkundenfälschung ein&lt;/a&gt;. Thema ist ein Operations&amp;shy;­bild, das erst nachträglich ins USZ-interne Informations&amp;shy;­system hochgeladen wurde.&lt;/p&gt;"},{"title":"30.07.2020","date":"30. Juli 2020","content":"&lt;p&gt;Anonym bleibende USZ-Angestellte wenden sich per verschlüsselte E-Mail mit einem ausführlichen Whistle&amp;shy;­blowing an die Spital&amp;shy;leitung. Sie fordern, dass eine Unter&amp;shy;­suchung gegen den leitenden Arzt eingeleitet wird, der ein gutes halbes Jahr zuvor Vorwürfe gegen Maisano erhoben hatte. Der leitende Arzt gefährde die Patienten­&amp;shy;sicherheit und betreibe Mobbing am Arbeitsplatz.&lt;/p&gt;"},{"title":"23.08.2020","date":"23. August 2020","content":"&lt;p&gt;Die «NZZ am Sonntag» &lt;a href=&apos;https://nzzas.nzz.ch/schweiz/unispital-zuerich-neuer-verdacht-ld.1572772&apos;&gt;berichtet&lt;/a&gt;, die USZ-Herzchirurgie habe den Krankenkassen Kosten in Rechnung gestellt, die in dieser Form gar nie angefallen seien. Wie der «Tages-Anzeiger» drei Wochen später &lt;a href=&apos;https://www.tagesanzeiger.ch/unispital-untersucht-honorare-in-millionenhoehe-807213039701&apos;&gt;ergänzt&lt;/a&gt;, habe die Klinik damit 1,29&amp;nbsp; Millionen Franken an zusätzlichen Honoraren eingenommen.&lt;/p&gt;"},{"title":"...","date":"...","content":"&lt;p&gt;Die Chronologie geht weiter in Teil 3.&lt;/p&gt;"}]}'></republik-usz>
