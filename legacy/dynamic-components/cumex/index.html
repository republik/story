      <h1>Cumex</h1>
      <republik-cumex data='{"anchor":"cumcum","phases":[{"active":["investors-bank","brokery"],"html":"Am &lt;b&gt;19. Februar 2007&lt;/b&gt;, kurz vor dem Start der Dividenden-Saison, verkaufen acht Investoren aus &lt;b&gt;Schweden, den USA und Holland&lt;/b&gt; über einen Broker, &lt;span style=\"white-space:nowrap\"&gt;40&amp;thinsp;000&lt;/span&gt; Aktien von Schweizer Unternehmen für &lt;b&gt;CHF 3,7&amp;nbsp;Milliarden&lt;/b&gt; an {BANK_NAME} Bank in &lt;b&gt;Dänemark&lt;/b&gt;. Es sind Aktien von Unternehmen die Teil des Swiss Market Index (&lt;b&gt;SMI&lt;/b&gt;) sind."},{"active":["investors-bank","brokery","brokerzw","bank-brokerzw"],"html":"Am gleichen Tag verkauft {BANK_NAME} gleichviel SMI-Futures über einen anderen Broker. Und sichert damit das Kursrisiko ab.&lt;br /&gt;&lt;br /&gt;Einige Jahre später hält das Bundesgericht dazu fest: Eine Transaktion dieser Dimension setzen klare Abmachungen zwischen den Parteien voraus."},{"active":["investors-bank","brokery","brokerzw","bank-brokerzw"],"html":"Warum nach Dänemark? Dänemark und die Schweiz haben ein Doppel&amp;shy;besteuerungs&amp;shy;abkommen welches die vollständige Rückerstattung der Verrechnungssteuer ermöglicht. Schweden, die USA und Holland nicht."},{"active":["companies","companies-bank"],"html":"Die Schweizer Unternehmen zahlen zwischen Anfang März und Ende Mai&amp;nbsp;2007 mindestens &lt;b style=\"white-space:nowrap\"&gt;CHF 70 Millionen&lt;/b&gt; Dividen an die neue Besitzerin {BANK_NAME} aus. 35% Verrechnungssteuer bleibt in der Schweiz."},{"active":["companies","companies-bank","estv","bank-estv","estv-bank","estv-bank-money"],"html":"{BANK_NAME} fordert die Verrechnungssteuer von der Eidgenössischen Steuerverwaltung zurück."},{"active":["brokery","brokerzw","investors-bank","bank-brokerzw","bank-brokery","brokerzw-bank","brokery-money","brokerzw-money","companies","estv"],"html":"Am &lt;b&gt;15. Juni 2007&lt;/b&gt;, nach Ende der Dividenden-Saison, werden die Futures zurückgekauft und die Aktien zurückverkauft. Bei Nordea Dänemark bleibt ein kleiner Gewinn. Die Dividenerträge sind mutmasslich über die Aktien– und Future-Transaktionen zu den Brokern und Investoren, und über Finanzierungskosten an die Muttergesellschaft Nordea in Schweden geflossen."},{"active":["brokery","brokerzw","investors-bank","bank-brokerzw","bank-brokery","brokerzw-bank","brokery-money","brokerzw-money","companies","estv","companies-bank","estv-bank","estv-bank-money"],"html":"Die Investoren, in Länder ohne Anrecht auf vollständige Rückerstattung, haben mutmasslich versucht die Steuer über das Konstrukt zu umgehen. Das Vorgehen bezeichnet man als Cum-Cum-Geschäft."},{"active":["brokery","brokerzw","investors-bank","bank-brokerzw","bank-brokery","brokerzw-bank","brokery-money","brokerzw-money","companies","estv","companies-bank","estv-bank","estv-bank-money","estv-bank-money-error"],"html":"Doch die Steuerverwaltung wird misstrauisch und stoppt mitten im 2007-Geschäft die Rückerstattungen. Sie weisst Anträge über CHF 26 Millionen aus dem Jahr 2007 ab und verlangt rund CHF 35 Millionen der  bereits erstatteten Steuer aus dem Jahr 2006 und Anfang 2007 zurück."},{"active":["brokery","brokerzw","investors-bank","bank-brokerzw","bank-brokery","brokerzw-bank","brokery-money","brokerzw-money","companies","estv","companies-bank","estv-bank","estv-bank-money","estv-bank-money-error"],"html":"Diesen Entscheid muss sie bis vors Bundesgericht verteidigen. Am 5. Mai 2015 erhält die Steuerverwaltung im Urteil &lt;a href=\"https://web.archive.org/web/20181014135617/https://entscheide.weblaw.ch/cache.php?link=05.05.2015_2C_895-2012&amp;sel_lang=de\"&gt;2C_895/2012&lt;/a&gt; grösstenteils Recht. {BANK_NAME} wird die effektive Nutzungsberechtigung der Dividenden abgesprochen und verliert damit den Anspruch auf die Rückerstattungen."}],"schema":"BGerNordea"}'></republik-cumex>
