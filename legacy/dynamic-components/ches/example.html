      <h1>Ches</h1>
      <republik-ches data='{"anchor":"plot","phases":[{"year":"2002","inlines":{"Deutschland:CDU":{},"Spanien:AP-P":{"label":"PP","country":true},"Deutschland:SPD":{},"Italien:FI-PdL":{"label":"FI","country":true},"Vereinigtes Königreich:Tories":{}},"title":"2002: Das Hufeisen","text":["Beginnen wir mit einem Blick auf die Grafik im Jahr 2002. Kurz nach der Einführung der Gemeinschafts­währung Euro herrscht Optimismus auf dem Kontinent. Athen bereitet sich auf die Olympischen Sommer­spiele 2004 vor, von Finanz- und Eurokrise ist noch weit und breit nichts zu sehen.","Die Parteien­landschaft präsentiert sich grob betrachtet wie ein Hufeisen: Die grossen Parteien in den EU-Ländern bewegen sich von leicht links bis leicht rechts der Mitte, und mit wenigen Ausnahmen haben sie eine positive Einstellung zur EU. Ausreisser in der EU-Position sind die konservative Tory-Partei in Grossbritannien sowie Splitter­parteien an den beiden extremen Rändern des Spektrums. Der Schwerpunkt liegt klar oben im Zentrum."]},{"year":"2006","inlines":{"Deutschland:CDU":{},"Spanien:AP-P":{"label":"PP","country":true},"Deutschland:SPD":{},"Frankreich:PS":{"country":true},"Vereinigtes Königreich:Tories":{},"Italien:FI-PdL":{"label":"FI","country":true},"Polen:PiS":{"label":"PiS","country":true,"pos":"right"}},"title":"2006: Leichtes Driften","text":["Kurz vor der Finanzkrise boomt die Wirtschaft in vielen EU-Ländern. Trotzdem ist augenfällig, wie die grossen Zentrums­parteien allmählich auseinanderdriften. Sie bleiben zwar solid in den Pro-EU-Quadranten (oben rechts und oben links), doch die linken Parteien wandern ideologisch nach links – zum Beispiel die Sozialisten in Frankreich –, und die rechten Parteien wandern ideologisch nach rechts – etwa der Partido Popular in Spanien.","Augenfällig im unteren rechten Quadranten: Als zweite grössere Partei nach den Konservativen Grossbritanniens bewegt sich Silvio Berlusconis Forza Italia in Richtung einer Anti-EU-Position. Zudem taucht mit Polens «Recht und Gerechtigkeit» eine neue, grössere EU-skeptische Kraft auf."]},{"year":"2010","inlines":{"Deutschland:CDU":{},"Deutschland:SPD":{},"Vereinigtes Königreich:Tories":{},"Italien:LN":{"label":"Lega","pos":"right"},"Österreich:FPÖ":{"label":"FPÖ","pos":"right"},"Schweden:SD":{"label":"SD","pos":"left"},"Frankreich:FN":{"label":"FN","pos":"left"}},"title":"2010: Braune Punkte","text":["Die Finanzkrise ist nun bereits voll im Gange. In manchen Ländern scheint sie ausgestanden, andere haben noch stärker zu kämpfen. Im politischen Zentrum löst die Krise allerdings wenig aus: Die grossen Mitteparteien haben sich ideologisch und bezüglich ihrer Position zur EU kaum bewegt.","Allerdings tauchen am Rand des rechten, unteren Quadranten einige neue, braune Punkte auf: die Lega, die FPÖ, die Schweden­demokraten, der Front National, die UK Independence Party und weitere rechtsnationale Parteien. Es sind radikale Kräfte, die sich in dieser Zeit neu formieren und mit stark EU-feindlichen Positionen in die politische Arena eintreten."]},{"year":"2014","inlines":{"Deutschland:CDU":{},"Deutschland:SPD":{},"Vereinigtes Königreich:Tories":{},"Deutschland:AfD":{},"Italien:M5S":{}},"title":"2014: Fünf Sterne","text":["Die Eurokrise, die 2011 ausgebrochen ist, wird zur Zäsur. Sie dominiert die Schlagzeilen und löst in diversen EU-Staaten schwere Rezessionen aus. Eine Folge davon ist, dass die grossen Mitte­parteien allmählich zerfransen: Ihre Stunde scheint gezählt.","Derweil gewinnen die rechts­konservativen, anti­europäischen Parteien an Stärke. Mit der «Alternative für Deutschland» taucht ein neuer Name auf.","Erstmals taucht nun in der Grafik ein grosser, grüner Fleck auf: die 5-Sterne-Bewegung in Italien. Die Partei steht irgendwo in der Mitte des Links-Rechts-Spektrums, vertritt aber eine eindeutig ablehnende Haltung zur EU."]},{"year":"2017","inlines":{"Deutschland:CDU":{},"Deutschland:SPD":{},"Deutschland:Linke":{},"Vereinigtes Königreich:Tories":{},"Vereinigtes Königreich:Lab":{"label":"Labour"},"Deutschland:AfD":{},"Italien:M5S":{}},"title":"2017: Zersplitterung","text":["In der jüngsten verfügbaren Auswertung der Chapel Hill Expert Survey zeigt sich die vollendete Zersplitterung der europäischen Parteien­landschaft. Die grossen Mitte­parteien Frankreichs zum Beispiel sind verschwunden, die Parteien im konservativen, antieuropäischen Lager haben weiter zugelegt.","Gegenüber 2014 werden weitere Verschiebungen sichtbar. Viele Parteien sind auf der vertikalen Achse nach unten gerutscht – also EU-kritischer geworden. Andere, wie etwa die Linke aus Deutschland, sind wieder etwas EU-freundlicher geworden. Auch die Cinque Stelle haben ihre Position zur EU, die 2014 noch extrem ablehnend war, etwas gemässigt. Dagegen taucht ein neuer, grosser roter Fleck im linken Spektrum mit einer ablehnenden Haltung zur EU auf: die britische Labour-Partei unter Jeremy Corbyn."]}]}'></republik-ches>
