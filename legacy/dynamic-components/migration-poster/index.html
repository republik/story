abel","value":"einwanderten"},{"key":"step2/text","value":"In den 1990er-Jahren führten die Kriege auf dem Balkan zu einer Zunahme der Zuwanderung. Die Schweiz anerkannte allerdings lediglich einen kleinen Teil der Asylsuchenden aus dem ehemaligen Jugoslawien als Flüchtlinge. Nur sie gelten statistisch als Einwanderer."},{"key":"step3/text","value":"2002 trat das sogenannte Freizügigkeits­abkommen in Kraft. In den letzten zwanzig Jahren machte die Zuwanderung aus der EU knapp zwei Drittel der gesamten Zuwanderung in die Schweiz aus."},{"key":"step4/text","value":"Die Personenfreizügigkeit für EU-Angehörige war während mehrerer Jahre durch Kontingente beschränkt. 2007 fielen die Beschränkungen für die mittel-, west- und nordeuropäischen EU-Staaten, 2014 die für die meisten osteuropäischen."},{"key":"step5/text","value":"2015 kam es auch wegen des Kriegs in Syrien zur Flucht von Hunderttausenden Menschen nach Europa. Rund 40’000 – vor allem Syrer, Eritreerinnen und Afghanen – stellten in der Schweiz ein Asylgesuch. Als Flüchtlinge anerkannt wurden vor allem eritreische Gesuchstellerinnen."}],"chartSubTitle":"Ein- und Auswanderung in den letzten 50 Jahren"}'></republik-migration-poster>
