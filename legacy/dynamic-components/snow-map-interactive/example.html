      <h1>Snow Map Interactive</h1>
      <republik-snow-map-interactive data='{"anchor":"plot","title":"Choleraausbruch im Stadtteil Soho","lead":"Wie hat sich Cholera verbeitet?","phases":[{"step":"step1"},{"step":"step2"},{"step":"step3"}],"translations":[{"key":"step1/text","value":"In Karten, die später weltberühmt werden sollten, zeichnete Snow die Cholera-Todesfälle mit schwarzen Balken in den Häusern ein."},{"key":"step2/text","value":"Hier zählte er beispielsweise die {deaths} im Stadtteil Soho rund um die Broad Street während der Welle von 1854. Snow hatte bereits eine Theorie entwickelt, wie sich Cholera verbreitete. Er glaubte, dass Cholera ansteckend sei und der Erreger geschluckt werden musste. Wie aber konnte er dann so schnell übertragen werden?"},{"key":"step3/text","value":"Snow glaubte, die Übertragung müsse vom Erbrochenen oder dem Stuhl ausgehen und immer dort, wo Trinkwasser und Abwasser nicht gründlich voneinander getrennt waren, zurück zum Menschen gelangen. Also zeichnete er auf den Strassen die {pumps} ein. Bereits früher hatten Inspekteure festgestellt, dass bei einem Cholera-Ausbruch in einer Londoner Strasse vor allem jene Haushalte betroffen waren, deren Wasserversorgung mit einem überlaufenden Tank verbunden war."},{"key":"step2/deaths","value":"Cholera-Todesfälle"},{"key":"step3/pumps","value":"Pumpen"}],"labels":{"deaths":"Cholera-Todesfälle","pumps":"Pumpen","source":"Quelle: ","sourceText":"John Snow","href":"https://books.google.de/books?id=-N0_AAAAcAAJ&amp;hl=de"}}'></republik-snow-map-interactive>
